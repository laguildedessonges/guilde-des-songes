<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Titre et description tels qu'ils paraissent dans les résultats de
         recherche. La description reprend la phrase d'accueil du site : c'est
         elle qui doit décider quelqu'un à cliquer. -->
    <title>La Guilde des Songes : Association de jeu de rôle à Dijon</title>
    <meta
      name="description"
      content="Débutant·e ou vétéran des dés, pour une campagne au long cours, une soirée one-shot ou une partie de jeu de plateau : la Guilde des Songes vous accueille autour de ses tables."
    />

    <!-- Aperçu partagé sur les réseaux et les messageries. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="La Guilde des Songes" />
    <meta property="og:title" content="La Guilde des Songes : Association de jeu de rôle à Dijon" />
    <meta
      property="og:description"
      content="Débutant·e ou vétéran des dés, pour une campagne au long cours, une soirée one-shot ou une partie de jeu de plateau : la Guilde des Songes vous accueille autour de ses tables."
    />
    <meta property="og:url" content="https://laguildedessonges.net/" />
    <meta property="og:image" content="https://laguildedessonges.net/logo-guilde.png" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Adresse de référence : évite qu'un moteur traite www et la racine, ou
         une URL suivie de paramètres, comme autant de pages différentes. -->
    <link rel="canonical" href="https://laguildedessonges.net/" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f4eeee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#241a1c" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <script>
      // Thème appliqué avant le premier rendu : évite le flash clair au
      // chargement quand le mode sombre est actif.
      ;(() => {
        const choix = localStorage.getItem('theme') || 'system'
        const sombre =
          choix === 'dark' ||
          (choix === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = sombre ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
