# À chaque modification poussée sur main, le site est reconstruit et mis en
# ligne sur GitHub Pages. Rien à lancer à la main.
name: Publier le site

on:
  push:
    branches: [main]
  # Permet aussi de republier à la demande depuis l'onglet Actions.
  workflow_dispatch:

# Droits nécessaires au déploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; la plus récente gagne.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le site est servi dans un sous-dossier
      # (laguildedessonges.github.io/guilde-des-songes/) :
      # les chemins des fichiers et des liens doivent en tenir compte. Sur un domaine
      # à la racine (laguildedessonges.net), mettre BASE_PATH: /
      - run: npm run build
        env:
          BASE_PATH: /guilde-des-songes/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
